[[cases]]
id = "gcp-service-account-json"
profile = "public-issue"
format = "json"
min_redactions = 2
expected_detectors = ["escaped-private-key-pem", "contact-email"]
expected_classes = ["secret.private_key", "identity.contact"]
must_redact = [
  "MIIEvFakeFixtureOnly",
  "safe-bundle-fixture@example.iam.gserviceaccount.com",
]
must_keep = [
  "\"type\": \"service_account\"",
  "\"project_id\": \"safe-bundle-fixture\"",
]
input = '''
{
  "type": "service_account",
  "project_id": "safe-bundle-fixture",
  "private_key": "-----BEGIN PRIVATE KEY-----\nMIIEvFakeFixtureOnly\n-----END PRIVATE KEY-----\n",
  "client_email": "safe-bundle-fixture@example.iam.gserviceaccount.com"
}
'''

[[cases]]
id = "http-support-request"
profile = "public-issue"
format = "http"
min_redactions = 3
expected_detectors = [
  "internal-url",
  "authorization-bearer",
  "secret-key-value",
  "contact-email",
]
expected_classes = [
  "network.endpoint",
  "secret.auth_token",
  "secret.password",
  "identity.contact",
]
must_redact = [
  "http://api.internal/v1/status",
  "abcdefghij12345",
  "customKey_1234567890",
  "developer@example.com",
]
must_keep = [
  "GET ",
  "HTTP/1.1",
  "User-Agent:",
]
input = '''
GET http://api.internal/v1/status HTTP/1.1
Host: api.internal
Authorization: Bearer abcdefghij12345
X-Api-Key: customKey_1234567890
From: developer@example.com
User-Agent: safe-bundle-fixture
'''

[[cases]]
id = "structured-yaml"
profile = "public-issue"
format = "yaml"
min_redactions = 3
expected_detectors = [
  "connection-string",
  "private-ipv4",
  "contact-email",
]
expected_classes = [
  "secret.connection_string",
  "identity.host",
  "identity.contact",
]
must_redact = [
  "postgres://app:supersecret@db.internal/app",
  "supersecret",
  "10.42.0.7",
  "ops@example.com",
]
must_keep = [
  "service:",
  "retries: 2",
]
input = '''
service:
  name: support-api
  database: "postgres://app:supersecret@db.internal/app"
  private_ip: "10.42.0.7"
  owner: "ops@example.com"
  retries: 2
'''

[[false_positive_cases]]
id = "benign-config-flags"
profile = "public-issue"
format = "env"
must_keep = [
  "PASSWORD_POLICY=required",
  "SECRET_ENABLED=false",
  "TOKEN_COUNT=128",
  "SESSION_STATE=active",
  "COOKIE_MODE=disabled",
]
input = '''
PASSWORD_POLICY=required
SECRET_ENABLED=false
TOKEN_COUNT=128
SESSION_STATE=active
COOKIE_MODE=disabled
'''
