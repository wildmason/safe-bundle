AWS_SECRET_ACCESS_KEY=abcdefghijklmnopqrstuvwxyzABCDEFGHIJKLMN
AWS_SESSION_TOKEN=fixtureawssessiontokenabcdefghijklmnopqrstuvwxyz
STRIPE_WEBHOOK_SECRET=fixture_stripe_webhook_secret_abcdefghijklmnopqrstuvwxyz
SENDGRID_API_KEY=fixture_sendgrid_token_abcdefghijklmnopqrstuvwxyz
DATADOG_API_KEY=fixture_datadog_token_abcdefghijklmnopqrstuvwxyz
NETLIFY_AUTH_TOKEN=abcdefghijklmnopqrstuvwxyz123456
VERCEL_TOKEN=abcdefghijklmnopqrstuvwxyz123456
POSTMARK_SERVER_TOKEN=fixturepostmarktoken1234567890
SENTRY_AUTH_TOKEN=fixture_sentry_token_abcdefghijklmnopqrstuvwxyz
SUPABASE_SERVICE_ROLE_KEY=fixture.supabase.service.role.abcdefghijklmnopqrstuvwxyz
TWILIO_AUTH_TOKEN=fixture_twilio_token_abcdefghijklmnopqrstuvwxyz
GCP_API_KEY=fixture_gcp_token_abcdefghijklmnopqrstuvwxyz
AZURE_STORAGE=DefaultEndpointsProtocol=https;AccountName=acct;AccountKey=fixtureazurestoragekeyabcdefghijklmnopqrstuvwxyz;EndpointSuffix=core.windows.net
LEMON_SQUEEZY_API_KEY=ls_live_abcdefghijklmnopqrstuvwxyz
